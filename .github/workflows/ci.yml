name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Release readiness
        run: python tools/release_check.py

      - name: Compile Python
        run: python -m compileall -q scrap_editor_app companion_mod scrap_mechanic_save_editor.py terrain_map.py

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check scrap_editor_app/web/app.js
          node --check scrap_editor_app/web/map3d.js
          node --check scrap_editor_app/web/companion_minimap.js
          node --check scrap_editor_app/web/companion_overlay.js
          node --check scrap_editor_app/web/companion_capture.js
          node --check scrap_editor_app/web/companion_waypoints.js
          node --check scrap_editor_app/web/companion_preview.js

      - name: Map navigation regressions
        run: node tools/test_map_navigation.cjs

      - name: Frame-budgeted visibility regressions
        run: node tools/test_map_visibility.cjs

      - name: Unit tests
        run: python -m unittest discover -v
